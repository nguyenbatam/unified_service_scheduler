# Docker's embedded DNS. `resolve` re-resolves the backends at runtime (nginx >= 1.27.3 OSS), so
# `docker compose up -d --build backend-1 backend-2` (new container, new IP) needs no gateway
# restart; valid=5s bounds how long a stale address is used. The shared zone is required by it.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream scheduler_backends {
    zone backends 64k;
    least_conn;
    server backend-1:8080 resolve;
    server backend-2:8080 resolve;
    # Reuse upstream connections (needs HTTP/1.1 and an empty Connection header in /api/).
    keepalive 64;
}

# Template (rendered by the nginx image's entrypoint): ${SCHEDULER_WEB_IP} is the web UI's fixed
# compose address.
#
# Client address handed to the backends (their rate limits key on it; backends trust only this
# gateway's address via TRUSTED_PROXIES). Port 80 is the public edge, so whatever a client sends
# in X-Forwarded-For / X-Real-IP is ignored there. Port 8080 is not published and serves only the
# web UI's Nginx: its X-Real-IP is the browser's address. Any other caller on 8080 is refused.
map "$server_port:$remote_addr" $from_web {
    "8080:${SCHEDULER_WEB_IP}" 1;
    default 0;
}

map "$server_port:$from_web" $internal_refused {
    "8080:0" 1;
    default 0;
}

map "$from_web:$http_x_real_ip" $client_addr {
    "~^1:(?<forwarded_addr>[0-9A-Fa-f:.]+)$" $forwarded_addr;
    default $remote_addr;
}

# Scheme the browser used (the backends' cookie-endpoint Origin check compares it with Origin):
# believed from the web UI's Nginx only, like X-Real-IP; anyone else gets this edge's own scheme.
# Behind a TLS terminator in front of port 80, that terminator's scheme must reach here instead.
map "$from_web:$http_x_forwarded_proto" $client_proto {
    "~^1:(?<forwarded_proto>https?)$" $forwarded_proto;
    default $scheme;
}

server {
    listen 80;
    listen 8080;
    server_name _;

    if ($internal_refused) {
        return 403;
    }

    # $http_host keeps the port the browser used (e.g. localhost:8081): the backend's WebSocket
    # origin check compares it with the Origin header.
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $client_addr;
    proxy_set_header X-Forwarded-For $client_addr;
    proxy_set_header X-Forwarded-Proto $client_proto;

    location /api/v1/ws/ {
        proxy_pass http://scheduler_backends;
        proxy_http_version 1.1;
        # proxy_set_header in a location replaces every inherited one, so repeat them all.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $client_addr;
        proxy_set_header X-Forwarded-For $client_addr;
        proxy_set_header X-Forwarded-Proto $client_proto;
        # App sends WS ping ~54s; keep proxy idle above pongWait (60s).
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Only the API is public; /metrics is scraped by Prometheus on each backend directly.
    location /api/ {
        proxy_pass http://scheduler_backends;
        proxy_http_version 1.1;
        # Empty Connection keeps the upstream connection alive for reuse (keepalive above);
        # proxy_set_header in a location replaces every inherited one, so repeat them all.
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $client_addr;
        proxy_set_header X-Forwarded-For $client_addr;
        proxy_set_header X-Forwarded-Proto $client_proto;
        # Above the backend's REQUEST_TIMEOUT (20s) and its 30s write timeout, so a request the
        # backend gives up on reaches the client as the backend's 503 busy, not a gateway 504.
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        # Above the backend's 1 MiB body cap (nginx's default is exactly 1m), so an oversized
        # body gets the backend's JSON 413 too_large; past 2m the gateway answers the same JSON.
        client_max_body_size 2m;
        error_page 413 = @too_large;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"too_large","message":"request body must be at most 1 MiB"}}';
    }

    # Liveness of the gateway itself (compose healthcheck); says nothing about the backends.
    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
