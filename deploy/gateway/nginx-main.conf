# Main context for the gateway (replaces the image's /etc/nginx/nginx.conf, which caps each worker
# at 1024 connections; a proxied request holds two, and the stress run keeps ~1000 in flight plus
# WebSockets). The server/upstream config is the conf.d template next to this file.
user  nginx;
worker_processes  auto;
worker_rlimit_nofile  16384;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No query strings in the log: they carry customer search text (?q= name, phone, email), VINs,
    # and the WebSocket's ?ticket= JWT. Hence $uri (path only, normalised) instead of "$request",
    # and the referer cut at its "?".
    map $http_referer $referer_path {
        "~^(?<path>[^?#]*)"  $path;
        default              "";
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$referer_path" '
                      '"$http_user_agent" "$http_x_forwarded_for" rid=$request_id '
                      'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
