global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: scheduler-backends
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend-1:8080
          - backend-2:8080
        labels:
          service: unified-service-scheduler

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
