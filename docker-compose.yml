x-backend-env: &backend-env
  # Docker DNS — do not reuse host DATABASE_URL / REDIS_URL / KAFKA_BROKERS from .env
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: ${KAFKA_TOPIC}
  KAFKA_TOPIC_PARTITIONS: "${KAFKA_TOPIC_PARTITIONS:-3}"
  HTTP_ADDR: "${HTTP_ADDR}"
  JWT_SECRET: ${JWT_SECRET}
  # Per replica; two replicas share Postgres max_connections=300 with the tests and tools.
  DB_MAX_CONNS: "${DB_MAX_CONNS:-20}"
  # Only the gateway may set the client address (its X-Real-IP); anything else, including host
  # connections through the published port, is keyed on its own peer address.
  TRUSTED_PROXIES: "${TRUSTED_PROXIES:-${SCHEDULER_GATEWAY_IP:-172.28.50.10}}"
  ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
  NO_SHOW_SWEEP: "${NO_SHOW_SWEEP:-true}"
  NOTIFY_WEBHOOK_URL: "${NOTIFY_WEBHOOK_URL:-}"
  OVERRUN_EXTEND_STEP: "${OVERRUN_EXTEND_STEP:-15m}"
  # Per-instance cache of GET /dealerships and /service-types (0s-5s; 0s disables).
  CATALOG_CACHE_TTL: "${CATALOG_CACHE_TTL:-2s}"
  # Per-request handler deadline (503 busy on expiry): below the 30 s HTTP write timeout and the
  # gateway's 35 s proxy_read_timeout.
  REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-20s}"
  # Read throttles, requests per minute: per signed-in customer, and per client address.
  READ_LIMIT_PER_USER: "${READ_LIMIT_PER_USER:-600}"
  READ_LIMIT_PER_IP: "${READ_LIMIT_PER_IP:-3000}"
  AVAILABILITY_LIMIT_PER_USER: "${AVAILABILITY_LIMIT_PER_USER:-120}"
  AVAILABILITY_LIMIT_PER_IP: "${AVAILABILITY_LIMIT_PER_IP:-600}"
  WRITE_LIMIT_PER_USER: "${WRITE_LIMIT_PER_USER:-30}"
  WRITE_LIMIT_PER_IP: "${WRITE_LIMIT_PER_IP:-120}"
  # Sessions: access token TTL, refresh token idle TTL, absolute session end, refresh throttle.
  ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL:-15m}"
  SESSION_IDLE_TTL: "${SESSION_IDLE_TTL:-24h}"
  SESSION_MAX_TTL: "${SESSION_MAX_TTL:-168h}"
  REFRESH_LIMIT_PER_IP: "${REFRESH_LIMIT_PER_IP:-60}"
  # This stack serves plain http (gateway on localhost), so the refresh cookie cannot be Secure
  # here (the server's own default is true). Behind HTTPS set AUTH_COOKIE_SECURE=true.
  AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"

x-backend-deps: &backend-deps
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy

# Shared by backend-1 and backend-2 (each adds its INSTANCE_ID, SEED, and host port).
x-backend: &backend
  image: ${BACKEND_IMAGE:-unified-service-scheduler/backend:local}
  # Graceful shutdown waits up to ~25s for an in-flight outbox publish or notification send
  # (cmd/server drainBudget) plus the closes after it; Docker's default 10s would SIGKILL first.
  stop_grace_period: 40s
  depends_on: *backend-deps
  # Readiness: 503 only while Postgres is unreachable (Redis is fail-open); cached 1 s server-side.
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health/ready || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 6
    start_period: 20s
    start_interval: 1s

services:
  db:
    image: postgres:18.6-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host-side services (tests, tools) only: loopback, never the LAN.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql (versioned data dir inside).
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8.2.2-alpine
    ports:
      # No password: loopback only.
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # As in production: the backends create the topic at startup (events.EnsureTopic).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      # The EXTERNAL listener (advertised as localhost) for host tools; loopback only.
      - "127.0.0.1:${KAFKA_HOST_PORT}:9094"
    healthcheck:
      # Each probe starts a JVM (~1-2 s CPU): poll fast only while booting, then every 30 s.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
      start_interval: 3s

  backend-1:
    <<: *backend
    # Built once here; backend-2 runs the same image (same tag, no build of its own).
    build:
      context: ./backend
    environment:
      <<: *backend-env
      # Distinct per replica: it names the per-instance Kafka group that feeds this hub.
      INSTANCE_ID: ${BACKEND_1_INSTANCE_ID:-backend-1}
      SEED: "${BACKEND_1_SEED}"
    ports:
      - "127.0.0.1:${BACKEND_1_HOST_PORT}:8080"

  backend-2:
    <<: *backend
    # The image comes from backend-1's build; never try a registry for it.
    pull_policy: never
    environment:
      <<: *backend-env
      INSTANCE_ID: ${BACKEND_2_INSTANCE_ID:-backend-2}
      SEED: "${BACKEND_2_SEED}"
    depends_on:
      <<: *backend-deps
      backend-1:
        condition: service_started
    ports:
      - "127.0.0.1:${BACKEND_2_HOST_PORT}:8080"

  gateway:
    image: nginx:1.30.6-alpine
    # Port 80 is published (public edge); 8080 is internal-only, for the web UI's Nginx. The config
    # is a template: the image's entrypoint fills in SCHEDULER_* (the web UI's fixed address).
    # nginx-main.conf replaces the image's main context (worker_connections). The upstream
    # re-resolves backend-1/2 at runtime (`resolve`), so rebuilding a backend needs no gateway restart.
    volumes:
      - ./deploy/gateway/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/gateway/nginx-main.conf:/etc/nginx/nginx.conf:ro
    environment:
      NGINX_ENVSUBST_FILTER: "^SCHEDULER_"
      SCHEDULER_WEB_IP: ${SCHEDULER_WEB_IP:-172.28.50.11}
    networks:
      default:
        ipv4_address: ${SCHEDULER_GATEWAY_IP:-172.28.50.10}
    ports:
      - "${GATEWAY_PORT}:80"
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/gateway-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

  web:
    # Fixed tag (not the project-derived name) so CI can build it once with a layer cache and
    # start the stack without rebuilding.
    image: ${WEB_IMAGE:-unified-service-scheduler/web:local}
    build:
      context: ./web
      args:
        # The local demo shows one-click sign-in for the seeded accounts; set false for a real build.
        VITE_DEMO: ${VITE_DEMO:-true}
    networks:
      default:
        ipv4_address: ${SCHEDULER_WEB_IP:-172.28.50.11}
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # No --web.enable-lifecycle: nothing reloads or stops it over HTTP (restart to apply rule edits).
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    depends_on:
      - backend-1
      - backend-2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP}
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GF_AUTH_ANONYMOUS_ORG_ROLE}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # admin/admin and anonymous viewers by default (.env.example): loopback only.
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

# Fixed addresses for the two proxies, so backends and the gateway trust exactly them (not the
# whole network). Static IPs sit below ip_range, which is where every other container is placed.
networks:
  default:
    ipam:
      config:
        - subnet: ${SCHEDULER_SUBNET:-172.28.50.0/24}
          ip_range: ${SCHEDULER_DYNAMIC_RANGE:-172.28.50.128/25}

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
