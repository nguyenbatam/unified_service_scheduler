  /admin/outbox/failed:
    get:
      tags: [admin]
      summary: List failed (poisoned) outbox events, oldest first (group admin)
      description: |
        Events the worker stopped retrying after repeated content rejections from Kafka. A failed
        event no longer blocks its aggregate, so it is lost to consumers until requeued. The payload
        is not returned (it may carry customer PII). Only an admin with no dealership may call this;
        a dealership-scoped admin gets 403. One page ordered by creation time, then id (see
        Pagination); a requeued event leaves the list.
      parameters:
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200":
          description: Failed events
          headers:
            X-Next-Cursor: { $ref: "#/components/headers/NextCursor" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FailedOutboxEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Busy" }

  /admin/outbox/requeue:
    post:
      tags: [admin]
      summary: Return failed outbox events to pending (group admin)
      description: |
        For use once the cause is fixed (a broker limit raised, a payload repaired). Rejections are
        reset and the worker publishes the events again; ids that are not `failed` (already
        requeued, published, unknown) are ignored and not counted. A failed event whose aggregate
        has another event being published right now stays failed and is returned in `skipped`
        (requeuing it would put two events of one aggregate in flight); call again shortly. A
        requeued event keeps its `seq`,
        so it still precedes unpublished newer events of its aggregate, but it may reach consumers
        after newer events that were already published; consumers ignore stale versions. Only an
        admin with no dealership may call this; a dealership-scoped admin gets 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              additionalProperties: false
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: How many events moved back to pending, and which were skipped
          content:
            application/json:
              schema:
                type: object
                required: [requeued, skipped]
                properties:
                  requeued: { type: integer, minimum: 0 }
                  skipped:
                    type: array
                    description: Failed ids left as they are because their aggregate has an event in flight
                    items: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Busy" }

  /ws/dispatch:
    get:
      tags: [realtime]
      summary: WebSocket — per-audience event fan-out
      security: []
      parameters:
        - name: ticket
          in: query
          required: false
          description: "Ticket from `POST /auth/ws-ticket` (required for customers). Staff service clients may send `Authorization: Bearer <token>` instead; a customer's Bearer token is 403."
          schema: { type: string }
        - name: dealershipId
          in: query
          required: false
          description: 'Initial event filter. Change it later by sending `{"type":"subscribe","dealershipId":"<uuid or empty>"}`.'
          schema: { type: string, format: uuid }
      description: |
        Messages are `{type, instanceId, payload}`; `type` is an event type code (integer, see the
        enums above), named below. Delivery is at-least-once and may be out of order across
        instances: compare `payload.version` and refetch on reconnect.

        Who receives what:
        - **Staff:** `APPOINTMENT_*` for the subscribed dealership (all if none), payload
          `AppointmentNotice`; dealership-scoped staff never receive other dealerships' events.
        - **Owning customer:** `APPOINTMENT_*` for their own bookings, at any dealership whatever
          the subscription.
        - **Other customers:** `AVAILABILITY_CHANGED` (payload `AvailabilityNotice`, no identity) for
          events that change capacity, and — without a window — for a technician change, at the
          subscribed dealership (all if none).
        - **Everyone:** `CONFIG_UPDATED` (payload `ConfigNotice`) for a dealership or service type,
          whatever the subscription (the public catalog) — reload the catalog; dealership-scoped
          staff get only their own dealership's. `entity: 4` (technician: skills, shifts, absences)
          goes to staff only, filtered like `APPOINTMENT_*`; customers get the window-less
          `AVAILABILITY_CHANGED` above instead.

        Event types (codes): 15 `CONNECTED` (first frame), 1 `APPOINTMENT_CREATED`, 3
        `APPOINTMENT_CANCELLED`, 2 `APPOINTMENT_RESCHEDULED`, 4 `APPOINTMENT_CHECKED_IN`, 5
        `APPOINTMENT_STARTED`, 6 `APPOINTMENT_COMPLETED`, 7 `APPOINTMENT_NO_SHOW`, 10
        `APPOINTMENT_EXTENDED`, 8 `APPOINTMENT_REINSTATED`, 9 `APPOINTMENT_REASSIGNED`, 11
        `APPOINTMENT_OVERRUNNING` (in-progress work past its end that could not be auto-extended;
        staff and owner only), 14 `AVAILABILITY_CHANGED`, 13 `CONFIG_UPDATED`. The socket closes with 1008 when the login session
        ends (its absolute end, `sexp` / `sessionExpiresAt`, not the access token's expiry), when the user logs out anywhere (`POST /auth/logout`), or when the account is
        disabled or its role or dealership changes (each instance re-checks all its sockets in one
        sweep about once per ping period, with jitter, so this can take up to about a minute).

        Each instance holds at most 10 sockets per user. Over the cap the upgrade is refused with
        429 and `Retry-After` (a browser only sees a failed connection, close code 1006); two
        opens racing for the last place may instead be upgraded and then closed with 1013 (try
        again later). Clients should back off for at least the `Retry-After` (30 s) and grow the
        delay while connections keep failing before the `CONNECTED` frame.
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: Invalid dealershipId
        "401":
          description: Missing or invalid ticket/token
        "403":
          description: Bearer token of a non-staff user (customers must use a ticket)
        "429":
          description: This user already holds the maximum number of sockets on this instance
          headers:
            Retry-After: { schema: { type: integer, example: 30 } }
        "500":
          description: Unexpected failure while checking the session (error code `internal`, no detail)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503": { $ref: "#/components/responses/Busy" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-uss_refresh
      description: Opaque, rotating refresh token set by login/register/refresh (HttpOnly). Named `uss_refresh` (Path=/api/v1/auth) when `AUTH_COOKIE_SECURE=false`.

  headers:
    RefreshCookie:
      description: |
        `__Host-uss_refresh=<opaque token>; Path=/; Max-Age=<seconds until the token's idle expiry,
        capped at the session's end>; HttpOnly; Secure; SameSite=Strict` (no `Domain`). With
        `AUTH_COOKIE_SECURE=false` (a plain-http local stack only):
        `uss_refresh=<token>; Path=/api/v1/auth; Max-Age=…; HttpOnly; SameSite=Strict`.
      schema: { type: string }
    ClearRefreshCookie:
      description: "`__Host-uss_refresh=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict` (or `uss_refresh=; Path=/api/v1/auth; Max-Age=0; HttpOnly; SameSite=Strict` with `AUTH_COOKIE_SECURE=false`): clears the cookie."
      schema: { type: string }
    ETag:
      description: Quoted row version, e.g. `"3"`. Send back as If-Match.
      schema: { type: string }
    CatalogETag:
      description: Content hash of the page (body and next cursor), e.g. `"c-1f2e…"` (not a row version). Send back as If-None-Match.
      schema: { type: string }
    NextCursor:
      description: Opaque token for the next page (pass it back as `cursor` with the same filters); absent on the last page. See Pagination.
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Stale:
      description: If-Match does not match the current version (someone else changed it)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Ready:
      description: Readiness (`ok`, `degraded` = Redis down or request pool saturated, `unavailable` = Postgres down → 503)
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [ok, degraded, unavailable] }
              instance: { type: string }
              checks:
                type: object
                properties:
                  postgres: { type: string, enum: [ok, down] }
                  redis: { type: string, enum: [ok, down] }
                  pool: { type: string, enum: [ok, saturated] }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Appointment:
      description: Appointment after the change
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Appointment" }
    CrossOrigin:
      description: |
        Refused as cross-site (error code `forbidden`): `Sec-Fetch-Site: cross-site`, an `Origin`
        other than the request's own or `ALLOWED_ORIGINS`, or (cookie requests) no
        `X-Requested-With: fetch`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Missing, invalid, or expired token; the session was signed out; or the account is disabled
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TooLarge:
      description: Request body over 1 MiB (error code `too_large`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotModified:
      description: The `If-None-Match` tag still matches; reuse the cached body
      headers:
        ETag: { $ref: "#/components/headers/CatalogETag" }
    Busy:
      description: A database wait timed out (a lock behind an admin change, a slow statement, or the request deadline `REQUEST_TIMEOUT`); retry shortly
      headers:
        Retry-After: { schema: { type: integer, example: 1 } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Roster:
      description: Technician roster after the change
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TechnicianRoster" }
    Calendar:
      description: Dealership calendar after the change
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DealershipCalendar" }

  parameters:
    limit:
      name: limit
      in: query
      description: Page size (see Pagination).
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    cursor:
      name: cursor
      in: query
      description: The previous page's `X-Next-Cursor`, with the same filters; omit for the first page. Another list's or other filters' token is 400.
      schema: { type: string, maxLength: 2048 }
    dealershipId:
      name: dealershipId
      in: query
      required: true
      schema: { type: string, format: uuid }
    vehicleId:
      name: vehicleId
      in: query
      required: true
      schema: { type: string, format: uuid }
    serviceTypeId:
      name: serviceTypeId
      in: query
      description: One job line (or send serviceTypeIds).
      schema: { type: string, format: uuid }
    serviceTypeIds:
      name: serviceTypeIds
      in: query
      description: Several job lines, comma separated, 1–5, in line order (or send serviceTypeId).
      schema: { type: string }
      explode: false
    excludeAppointmentId:
      name: excludeAppointmentId
      in: query
      description: |
        Reschedule view: the appointment being moved. Its own hold (bay, technician, vehicle,
        staging arrival) is ignored, exactly as `POST /appointments/{id}/reschedule` does, so it
        can slide into an overlapping slot. Must be an appointment of `vehicleId` at `dealershipId`
        (400 otherwise) that the caller can see (404 otherwise), and one the reschedule would accept:
        confirmed (409 otherwise) and, for a customer, before the online change cutoff (422). The
        slots are computed for its booked snapshot (labour time, bay type, skills, level), as the
        reschedule moves it, never for the catalog as edited since; `serviceTypeId(s)` must name
        its booked job lines, in order (400 otherwise).
      schema: { type: string, format: uuid }
    technicianId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    appointmentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ifMatch:
      name: If-Match
      in: header
      required: false
      description: Strong version from ETag, exactly one quoted value (`"3"`). Omit or `*` to skip the check; bare (`3`), weak (`W/"3"`), malformed or list values are 400.
      schema: { type: string }
    ifMatchRequired:
      name: If-Match
      in: header
      required: true
      description: Strong version from ETag, exactly one quoted value (`"3"`). Missing or `*` is 428; bare, weak, malformed or list values are 400.
      schema: { type: string }
    cacheControlRequest:
      name: Cache-Control
      in: header
      required: false
      description: "`no-cache` (or `max-age=0`) reads through the instance's catalog cache and refreshes it, unless the cached body was loaded less than 0.5 s ago (concurrent reloads share one query)."
      schema: { type: string, example: no-cache }
    ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The `ETag` of a previous response; 304 while the list is unchanged.
      schema: { type: string }

  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [invalid, not_found, conflict, unavailable, unauthorized, forbidden, precondition_failed, precondition_required, rate_limited, busy, too_large, internal]
            message: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72 }
        name: { type: string, maxLength: 120 }

    AuthResponse:
      type: object
      required: [token, expiresAt, sessionExpiresAt, user]
      properties:
        token:
          type: string
          description: Access token (JWT, aud `api`; claims include `sid` and `sexp`). Keep it in memory only.
        expiresAt:
          type: string
          format: date-time
          description: Access token expiry (`ACCESS_TOKEN_TTL` after issue, never after `sessionExpiresAt`). Refresh before it.
        sessionExpiresAt:
          type: string
          format: date-time
          description: The login session's absolute end (`SESSION_MAX_TTL` after login); no refresh extends it.
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role:
          type: integer
          description: "1=admin 2=dispatcher 3=customer"
          enum: [1, 2, 3]
        customerId:
          type: string
          format: uuid
          description: Present for customers only.
        dealershipId:
          type: string
          format: uuid
          description: Staff home dealership; absent for customers and group-wide admins.

    Dealership:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        openTime: { type: string, example: "08:00" }
        closeTime: { type: string, example: "17:00" }
        lunchStart: { type: string, example: "12:00" }
        lunchEnd: { type: string, example: "13:00" }
        stagingCapacity: { type: integer, description: "Arrivals per staging window; 0 = unlimited" }
        stagingWindowMinutes: { type: integer, enum: [15, 30, 60] }
        policy: { $ref: "#/components/schemas/Policy" }
        today: { type: string, format: date }
        version: { type: integer }

    Policy:
      type: object
      description: The dealership's self-service and workshop rules.
      properties:
        customerLeadMinutes: { type: integer, minimum: 0, maximum: 10080, description: "Online booking notice" }
        customerChangeCutoffMinutes: { type: integer, minimum: 0, maximum: 10080, description: "Online cancel/reschedule closes this long before start" }
        bookingHorizonDays: { type: integer, minimum: 1, maximum: 365, description: "Customers book at most this far ahead" }
        noShowGraceMinutes: { type: integer, minimum: 5, maximum: 240 }
        expressMaxMinutes: { type: integer, minimum: 0, maximum: 600, description: "Waiters soft-upgrade general work to express only up to this length; 0 = never" }

    ServiceType:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        durationMinutes: { type: integer }
        requiredSkill: { type: integer, description: "1=lubrication 2=brakes 3=general" }
        requiredBayType: { type: integer, description: "1=express 2=general 3=diagnostic 4=alignment" }
        minSkillLevel: { type: integer, minimum: 1, maximum: 4 }
        version: { type: integer }

    Vehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        vin: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: integer }

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, description: "\"\" = none" }
        email: { type: string, description: "\"\" = none" }

    CustomerCreate:
      type: object
      required: [name]
      description: At least one of phone and email.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, maxLength: 30, description: "At least 6 digits; digits, spaces and + - ( ) . only" }
        email: { type: string, maxLength: 254, format: email, description: "Stored lowercased" }

    VehicleCreate:
      type: object
      required: [vin, make, model, year]
      properties:
        customerId: { type: string, format: uuid, description: "Staff only; required for staff" }
        vin: { type: string, minLength: 17, maxLength: 17, description: "ISO 3779 (no I, O, Q)" }
        make: { type: string, maxLength: 60 }
        model: { type: string, maxLength: 60 }
        year: { type: integer, minimum: 1980 }

    Slot:
      type: object
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        available:
          type: boolean
          description: |
            Bookable now. Includes starts that need one repair move: when no fitting bay (or no
            qualified on-duty technician) is free, the booking may move one other confirmed, not yet
            started appointment to another bay (technician) that fits it, in the same window (its
            customer sees no change; it gets an APPOINTMENT_REASSIGNED event), at most one move per
            missing resource.
        freeBays:
          type: integer
          description: Fitting bays free without any move; may be 0 on an available slot (bookable by one repair move)
        freeTechnicians:
          type: integer
          description: Qualified on-duty technicians free without any move; may be 0 on an available slot (bookable by one repair move)
        reason:
          type: string
          enum: [past, lead_time, beyond_horizon, lunch_break, vehicle_busy, staging_full, no_bay, no_technician, no_resources]
        recommended:
          type: boolean
          description: |
            A hint to steer customers by (false on every slot that is not available). Booking this
            start leaves no new idle gap on the bay and the technician the engine would book it on
            (its own best-fit pick, the same order the booking uses): on each, it butts against a
            booking or an edge of the bookable stretch (opening, lunch, closing; for a technician also
            their shift's start, end, and break) on at least one side. Starts in the middle of a free stretch
            split it into pieces a later long job may not fit. Never set on a slot bookable only by a
            repair move (freeBays or freeTechnicians 0).

    Availability:
      type: object
      properties:
        date: { type: string, format: date }
        timezone: { type: string }
        durationMinutes: { type: integer }
        closed: { type: boolean, description: "Closed that day (weekday closing day or closure); slots is empty" }
        closedReason: { type: string }
        reason:
          type: string
          enum: [day_too_short]
          description: Why an open day offers no start at all (`day_too_short` — its hours are shorter than the job); slots is empty
        slots:
          type: array
          items: { $ref: "#/components/schemas/Slot" }

    BookRequest:
      type: object
      description: Send `serviceTypeId` (one job line) or `serviceTypeIds` (1–5, in line order), not both.
      required: [dealershipId, vehicleId, startAt]
      oneOf:
        - required: [serviceTypeId]
        - required: [serviceTypeIds]
      properties:
        dealershipId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        serviceTypeId: { type: string, format: uuid }
        serviceTypeIds:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        isWaiter: { type: boolean, default: false }

    RescheduleRequest:
      type: object
      required: [startAt]
      properties:
        startAt: { type: string, format: date-time }
        isWaiter: { type: boolean, description: "Omit to keep the current value" }

    Appointment:
      type: object
      required: [id, dealershipId, dealershipName, customerId, customerName, vehicleId, vehicleLabel, vin,
        serviceTypeId, serviceName, durationMinutes, lines, requiredBayType, requiredSkills, minSkillLevel,
        serviceBayId, serviceBayName, serviceBayType, technicianId, technicianName, startAt, endAt, status,
        isWaiter, version]
      properties:
        id: { type: string, format: uuid }
        dealershipId: { type: string, format: uuid }
        dealershipName: { type: string }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        vehicleId: { type: string, format: uuid }
        vehicleLabel: { type: string }
        vin: { type: string }
        serviceTypeId: { type: string, format: uuid, description: "Primary (first) job line" }
        serviceName: { type: string, description: "Every line, joined with \" + \"" }
        durationMinutes: { type: integer, description: "Booked labour time (sum of lines), not the catalog's current value" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/AppointmentLine" }
        requiredBayType: { type: integer, enum: [1, 2, 3, 4], description: "Booked requirement: bay type that fits every line (1=express 2=general 3=diagnostic 4=alignment)" }
        requiredSkills:
          type: array
          items: { type: integer, enum: [1, 2, 3], description: "1=lubrication 2=brakes 3=general" }
        minSkillLevel: { type: integer, minimum: 1, maximum: 4 }
        serviceBayId: { type: string, format: uuid }
        serviceBayName: { type: string }
        serviceBayType: { type: integer, enum: [1, 2, 3, 4] }
        technicianId: { type: string, format: uuid }
        technicianName: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status:
          type: integer
          description: "1=confirmed 2=checked_in 3=in_progress 4=completed 5=cancelled 6=no_show"
          enum: [1, 2, 3, 4, 5, 6]
        isWaiter: { type: boolean }
        version: { type: integer }
        checkedInAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        overrunAt: { type: string, format: date-time, description: "In-progress work ran past its end and could not be auto-extended" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AppointmentNotice:
      type: object
      description: WebSocket payload for staff and the owning customer (no personal data).
      properties:
        id: { type: string, format: uuid }
        dealershipId: { type: string, format: uuid }
        status: { type: integer }
        version: { type: integer }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }

    AppointmentLine:
      type: object
      properties:
        lineNo: { type: integer }
        serviceTypeId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        durationMinutes: { type: integer }

    AppointmentChange:
      type: object
      description: One audit-trail entry; every change bumps the appointment version.
      properties:
        version: { type: integer }
        eventType: { type: integer, minimum: 1, maximum: 11, example: 9, description: "1=APPOINTMENT_CREATED 2=APPOINTMENT_RESCHEDULED 3=APPOINTMENT_CANCELLED 4=APPOINTMENT_CHECKED_IN 5=APPOINTMENT_STARTED 6=APPOINTMENT_COMPLETED 7=APPOINTMENT_NO_SHOW 8=APPOINTMENT_REINSTATED 9=APPOINTMENT_REASSIGNED 10=APPOINTMENT_EXTENDED 11=APPOINTMENT_OVERRUNNING" }
        actorId: { type: string, format: uuid, description: "Absent for system changes (sweepers)" }
        at: { type: string, format: date-time }
        status: { type: integer }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        serviceBayId: { type: string, format: uuid }
        technicianId: { type: string, format: uuid }

    NextAvailability:
      type: object
      properties:
        timezone: { type: string }
        durationMinutes: { type: integer }
        searchedFrom: { type: string, format: date }
        searchedTo: { type: string, format: date }
        slots:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              freeBays: { type: integer }
              freeTechnicians: { type: integer }
              recommended: { type: boolean, description: "As on the day's Slot: booking this start leaves no new idle gap" }

    AvailabilityNotice:
      type: object
      description: |
        WebSocket payload for other customers — capacity changed at this dealership. The window is
        the appointment's new one; a move (reschedule, early start) also frees its old window, so
        refresh the dealership's availability rather than only slots overlapping this window. A
        technician change (roster, skills) has no window (`startAt`/`endAt` absent): it may change
        any day, so refresh every view of that dealership (day grid and first-available list).
      required: [dealershipId]
      properties:
        dealershipId: { type: string, format: uuid }
        startAt: { type: string, format: date-time, description: "Absent for a technician change" }
        endAt: { type: string, format: date-time, description: "Absent for a technician change" }

    ConfigNotice:
      type: object
      properties:
        entity: { type: integer, enum: [2, 3, 4], description: "Aggregate type: 2=dealership 3=service_type 4=technician" }
        id: { type: string, format: uuid }
        version: { type: integer }

    Bay:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        bayType: { type: integer }

    Schedule:
      type: object
      properties:
        date: { type: string, format: date }
        timezone: { type: string }
        openTime: { type: string, description: "That day's hours (defaults when closed)" }
        closeTime: { type: string }
        lunchStart: { type: string, description: "That day's lunch, HH:MM (absent when closed or no lunch)" }
        lunchEnd: { type: string }
        closed: { type: boolean }
        closedReason: { type: string }
        bays:
          type: array
          items: { $ref: "#/components/schemas/Bay" }
        technicians:
          type: array
          description: Active technicians of the dealership (reassign targets)
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              skillLevel: { type: integer, minimum: 1, maximum: 4 }
              skills:
                type: array
                items: { type: integer }
        appointments:
          type: array
          items: { $ref: "#/components/schemas/Appointment" }

    FailedOutboxEvent:
      type: object
      required: [id, seq, aggregateType, aggregateId, eventType, attempts, rejections, lastError, createdAt]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, format: int64, description: Commit order within the aggregate }
        aggregateType: { type: integer, minimum: 1, maximum: 5, example: 1, description: "1=appointment 2=dealership 3=service_type 4=technician 5=user" }
        aggregateId: { type: string, format: uuid }
        eventType: { type: integer, minimum: 1, maximum: 13, example: 1, description: "1=APPOINTMENT_CREATED 2=APPOINTMENT_RESCHEDULED 3=APPOINTMENT_CANCELLED 4=APPOINTMENT_CHECKED_IN 5=APPOINTMENT_STARTED 6=APPOINTMENT_COMPLETED 7=APPOINTMENT_NO_SHOW 8=APPOINTMENT_REINSTATED 9=APPOINTMENT_REASSIGNED 10=APPOINTMENT_EXTENDED 11=APPOINTMENT_OVERRUNNING 12=SESSION_REVOKED 13=CONFIG_UPDATED" }
        attempts: { type: integer }
        rejections: { type: integer, description: Content rejections counted before it was marked failed }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }

    TechnicianAdmin:
      type: object
      properties:
        id: { type: string, format: uuid }
        dealershipId: { type: string, format: uuid }
        name: { type: string }
        skillLevel: { type: integer, minimum: 1, maximum: 4 }
        active: { type: boolean }
        version: { type: integer }
        skills:
          type: array
          items: { type: integer }

    NewDealership:
      type: object
      required: [name, timezone, openTime, closeTime]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string, example: Europe/London, description: IANA zone name }
        openTime: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        closeTime: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        lunchStart: { type: string, description: "HH:MM; send with lunchEnd, or omit both" }
        lunchEnd: { type: string }
        stagingCapacity: { type: integer, minimum: 0, maximum: 100, default: 0, description: 0 = unlimited }
        stagingWindowMinutes: { type: integer, enum: [15, 30, 60], default: 60 }
        policy:
          type: object
          description: Any subset of Policy fields (the rest take the defaults).
          properties:
            customerLeadMinutes: { type: integer, minimum: 0, maximum: 10080, default: 60 }
            customerChangeCutoffMinutes: { type: integer, minimum: 0, maximum: 10080, default: 60 }
            bookingHorizonDays: { type: integer, minimum: 1, maximum: 365, default: 90 }
            noShowGraceMinutes: { type: integer, minimum: 5, maximum: 240, default: 30 }
            expressMaxMinutes: { type: integer, minimum: 0, maximum: 600, default: 60 }

    NewBay:
      type: object
      required: [name, bayType]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        bayType: { type: integer, enum: [1, 2, 3, 4], description: "1 express, 2 general, 3 diagnostic, 4 alignment" }

    NewTechnician:
      type: object
      required: [dealershipId, name, skillLevel, skills]
      properties:
        dealershipId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        skillLevel: { type: integer, minimum: 1, maximum: 4 }
        skills:
          type: array
          minItems: 1
          items: { type: integer, enum: [1, 2, 3], description: "1 lubrication, 2 brakes, 3 general" }

    DealershipPatch:
      type: object
      description: Omitted fields keep their value. lunchStart/lunchEnd go together; both "" clears lunch.
      properties:
        openTime: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        closeTime: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        lunchStart: { type: string }
        lunchEnd: { type: string }
        stagingCapacity: { type: integer, minimum: 0, maximum: 100 }
        stagingWindowMinutes: { type: integer, enum: [15, 30, 60] }
        policy:
          type: object
          description: Any subset of Policy fields.
          properties:
            customerLeadMinutes: { type: integer, minimum: 0, maximum: 10080 }
            customerChangeCutoffMinutes: { type: integer, minimum: 0, maximum: 10080 }
            bookingHorizonDays: { type: integer, minimum: 1, maximum: 365 }
            noShowGraceMinutes: { type: integer, minimum: 5, maximum: 240 }
            expressMaxMinutes: { type: integer, minimum: 0, maximum: 600 }

    ServiceTypePatch:
      type: object
      properties:
        durationMinutes: { type: integer, minimum: 30, maximum: 600, multipleOf: 30 }
        minSkillLevel: { type: integer, minimum: 1, maximum: 4 }
        requiredSkill: { type: integer, minimum: 1, maximum: 3 }
        requiredBayType: { type: integer, minimum: 1, maximum: 4 }

    WeekdayHours:
      type: object
      description: Overrides the default hours on one ISO weekday. Closed days carry no times.
      required: [weekday, closed]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: "1=Monday … 7=Sunday" }
        closed: { type: boolean }
        openTime: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        closeTime: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        lunchStart: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        lunchEnd: { type: string, pattern: "^\\d{2}:\\d{2}$" }

    Closure:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date, description: "Dealership local day" }
        reason: { type: string, maxLength: 120 }

    DealershipCalendar:
      type: object
      properties:
        dealershipId: { type: string, format: uuid }
        version: { type: integer, description: "Dealership row version (If-Match)" }
        weekly:
          type: array
          items: { $ref: "#/components/schemas/WeekdayHours" }
        closures:
          type: array
          items: { $ref: "#/components/schemas/Closure" }

    TechnicianPatch:
      type: object
      properties:
        skillLevel: { type: integer, minimum: 1, maximum: 4 }
        active: { type: boolean }
        skills:
          type: array
          minItems: 1
          description: >-
            The full skill set (1 lubrication, 2 brakes, 3 general; duplicates dropped). Removing a
            skill an appointment not yet ended was booked with is 409.
          items: { type: integer, minimum: 1, maximum: 3 }

    TechnicianShift:
      type: object
      required: [weekday, startTime, endTime]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: "1=Monday … 7=Sunday" }
        startTime: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        endTime: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        breakStart: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        breakEnd: { type: string, pattern: "^\\d{2}:\\d{2}$" }

    TechnicianAbsence:
      type: object
      properties:
        id: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: string }

    TechnicianRoster:
      type: object
      properties:
        technicianId: { type: string, format: uuid }
        version: { type: integer, description: "Technician row version (If-Match)" }
        shifts:
          type: array
          description: Empty = works the dealership's opening hours
          items: { $ref: "#/components/schemas/TechnicianShift" }
        absences:
          type: array
          description: Upcoming (not yet ended)
          items: { $ref: "#/components/schemas/TechnicianAbsence" }
