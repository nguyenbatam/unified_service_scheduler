server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This server is the browser's edge: overwrite any client-sent forwarding headers with the real
    # peer address. The gateway's internal port (8080, not published) trusts X-Real-IP from us.
    # $http_host keeps the port (localhost:8081) for the backend's WebSocket origin check.
    # X-Forwarded-Proto is this server's own scheme: behind a TLS terminator in front of it the
    # backends would compute http:// while the browser's Origin says https://, and the cookie
    # endpoints (/auth/refresh, /auth/logout, login) answer 403 — list the public https origin in
    # ALLOWED_ORIGINS there (or pass the terminator's scheme through instead of $scheme).
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The SPA's assets are gzipped once at build time (-9, Dockerfile): gzip_static serves the .gz
    # next to the file when the browser accepts it. gzip covers what has no .gz (index.html, small
    # files). application/json is left out on purpose: the backends compress API bodies themselves
    # (passed through as is; see httpapi/compress.go), and auth responses must stay uncompressed.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript image/svg+xml;

    location /api/v1/ws/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        # proxy_set_header in a location replaces every inherited one, so repeat them all.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Align with gateway: app ping ~54s, pongWait 60s.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        # The gateway logs every API request path-only; nginx's default format here would keep
        # the query (?ticket=, ?q= search text).
        access_log off;
    }

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        access_log off;
        # Same as the gateway: above the backend's 1 MiB cap (nginx's default is exactly 1m), so
        # an oversized body gets the documented JSON 413 too_large, never nginx's HTML page.
        client_max_body_size 2m;
        error_page 413 = @too_large;
    }

    # The API docs belong to the API, not to the web app: one canonical address, the gateway's
    # /api/v1/docs. The SPA never loads them, so this origin does not forward them.
    location ^~ /api/v1/docs {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"API docs are served by the API gateway, not the web app"}}';
    }

    location = /api/v1/openapi.yaml {
        default_type application/json;
        return 404 '{"error":{"code":"not_found","message":"API docs are served by the API gateway, not the web app"}}';
    }

    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"too_large","message":"request body must be at most 1 MiB"}}';
    }

    # The SPA only: /api/ answers carry their own headers.
    # Defense in depth against XSS: no inline or third-party script, no framing. React's style
    # props go through CSSOM, which style-src does not restrict; 'self' covers the same-origin
    # WebSocket; data: is the inline favicon.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        # index.html names the current hashed bundles: revalidate it every time (a 304 via ETag),
        # so a deploy reaches open browsers on their next load.
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Vite's build output: file names carry a content hash, so a changed file is a new URL and
    # each one can be cached for a year without revalidation. A missing asset is a plain 404, never
    # index.html (which a browser would cache under the asset's name). The long Cache-Control is
    # sent on success only (no `always`), so a 404 is never cached for a year. add_header here
    # replaces the ones above, so nosniff is repeated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
